<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA CASITA - Tienda</title>
<style>
  *{box-sizing:border-box;font-family:Arial} body{margin:0;background:#FFF8E7;padding:15px}
  h1{text-align:center;color:#E65100} .card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px #00000020;margin-bottom:12px}
  input,button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ddd} button{background:#E65100;color:#fff;border:none;font-weight:bold;cursor:pointer}
  .btn-del{background:#ff5252} .prod{display:flex;justify-content:space-between;align-items:center}
  .stock{font-weight:bold;color:green}
</style>
</head>
<body>
<h1>🏠 LA CASITA</h1>
<p style="text-align:center">Tu tienda en la nube - Todo se guarda en internet</p>

<div class="card">
  <h3>➕ Agregar Producto</h3>
  <input id="nombre" placeholder="Nombre ej: Arroz">
  <input id="precio" type="number" placeholder="Precio ej: 5.50">
  <input id="stock" type="number" placeholder="Stock ej: 10">
  <button id="btnAgregar">Guardar en la Nube ☁️</button>
</div>

<div id="lista"></div>
<p id="estado" style="text-align:center;color:gray">Conectando a la nube...</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgwgxuJxpuboi5l3dBRXfpFIjYRg8Lj1Q",
  authDomain: "la-casita-web-6dea3.firebaseapp.com",
  projectId: "la-casita-web-6dea3",
  storageBucket: "la-casita-web-6dea3.firebasestorage.app",
  messagingSenderId: "798412075502",
  appId: "1:798412075502:web:121178259c0103a8549eff",
  measurementId: "G-TFF3H8TBH6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const col = collection(db, "productos");

document.getElementById("btnAgregar").onclick = async () => {
  const nombre = document.getElementById("nombre").value;
  const precio = parseFloat(document.getElementById("precio").value);
  const stock = parseInt(document.getElementById("stock").value);
  if(!nombre || !precio) return alert("Llena nombre y precio");
  await addDoc(col, { nombre, precio, stock: stock || 0 });
  document.getElementById("nombre").value="";
  document.getElementById("precio").value="";
  document.getElementById("stock").value="";
};

onSnapshot(col, (snap) => {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  document.getElementById("estado").innerText = "✅ Conectado a la nube - " + snap.size + " productos";
  snap.forEach(d => {
    const p = d.data();
    const div = document.createElement("div");
    div.className = "card prod";
    div.innerHTML = `<div><b>${p.nombre}</b><br>S/ ${p.precio} - <span class="stock">Stock: ${p.stock}</span></div>
    <div style="display:flex;gap:5px">
      <button onclick="vender('${d.id}', ${p.stock})" style="width:auto;background:#2E7D32">Vender -1</button>
      <button onclick="borrar('${d.id}')" style="width:auto" class="btn-del">Borrar</button>
    </div>`;
    lista.appendChild(div);
  });
});

window.borrar = async (id) => {
  if(confirm("¿Borrar este producto?")) await deleteDoc(doc(db, "productos", id));
};
window.vender = async (id, stockActual) => {
  if(stockActual <= 0) return alert("Sin stock");
  await updateDoc(doc(db, "productos", id), { stock: stockActual - 1 });
};
</script>
</body>
</html>
